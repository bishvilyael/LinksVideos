<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta property="og:title" content="מפות יעלים" />
    <meta property="og:description" content="" />
    <meta
      property="og:image"
      content="https://bishvilyael.github.io/LinksVideos/preview.jpg"
    />
    <meta
      property="og:url"
      content="https://bishvilyael.github.io/LinksVideos/"
    />
    <meta property="og:type" content="website" />
    <title>מפות יעלים</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <main class="card">
      <h1>מפות יעלים</h1>
      <p class="subtitle">קישורים למפות ועוד</p>

      <div id="linksContainer"></div>
      <section id="videosPanel" class="videos-panel hidden">
        <div id="videoGroupsContainer"></div>

        <div id="videoPlayer" class="video-player hidden">
          <h3 id="videoTitle"></h3>

          <div class="video-wrapper">
            <iframe
              id="youtubeFrame"
              title="YouTube video"
              frameborder="0"
              allow="
                accelerometer;
                autoplay;
                clipboard-write;
                encrypted-media;
                gyroscope;
                picture-in-picture;
              "
              allowfullscreen
            >
            </iframe>
          </div>
        </div>
      </section>
    </main>

    <script src="videos.js"></script>
    <script src="script.js"></script>
  </body>
</html>
